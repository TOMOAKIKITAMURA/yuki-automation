name: YU KI 自動エンゲージメント

on:
  schedule:
    # UTC 4時 = 日本時間13時
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  engage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: pip install -r requirements.txt

      - name: 関連ツイートを検索・返信を生成・投稿（最大3件）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python3 search_x.py \
            --query "(ファッション OR ブランディング OR アパレル OR ブランド戦略) -is:retweet lang:ja" \
            --max-results 20 > candidates.json
          echo "--- 検索結果 ---"
          cat candidates.json

          python3 generate_reply.py --candidates candidates.json > replies.json
          echo "--- 生成された返信案 ---"
          cat replies.json

          python3 - <<'PY'
          import json
          import subprocess

          with open("replies.json", encoding="utf-8") as f:
              replies = json.load(f)

          for r in replies[:3]:
              tweet_id = r.get("tweet_id")
              reply_text = r.get("reply_text")
              if not tweet_id or not reply_text:
                  continue
              subprocess.run(
                  ["python3", "post_to_x.py", "--text", reply_text, "--reply-to", str(tweet_id)],
                  check=True,
              )
          PY
