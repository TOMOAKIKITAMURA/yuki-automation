name: YU KI Instagram自動投稿

on:
  schedule:
    # UTC 10時 = 日本時間19時
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: pip install -r requirements.txt

- name: 【診断】Instagram APIへの疎通確認
        run: curl -v --max-time 15 "https://graph.instagram.com/v24.0/me?access_token=test" || echo "接続できませんでした(exit code $?)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python3 -u post_instagram_daily.py

      - name: 投稿状態をリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram_state.json
          git diff --cached --quiet || git commit -m "Update instagram posting state"
          git push
