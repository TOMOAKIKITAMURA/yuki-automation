name: Render YUKI Reel V2

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          pip install -r yuki_reel_automation/requirements.txt

      - name: Render Reel V2
        run: |
          cd yuki_reel_automation
          mkdir -p output
          python render_reel_v2.py             --config reel_config_v2.json             --output output/yuki_reel_v2.mp4

      - name: Upload finished Reel V2
        uses: actions/upload-artifact@v4
        with:
          name: yuki-reel-v2
          path: yuki_reel_automation/output/yuki_reel_v2.mp4
